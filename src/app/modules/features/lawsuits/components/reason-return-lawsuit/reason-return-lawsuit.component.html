<div class="accordion-card">
    <details open>
        <summary class="flex-y-row gap-2">
            <img src="assets/images/icons/bookmarks.svg" alt="bookmarks">
            <h6 class="small fw-6 op-7">{{translations.lawsuits.lawsuitDetails.reasonForReturningLawsuitForModification | translate}}</h6>
        </summary>

        <ng-container *ngIf="isEditMode">
            <app-modification-return></app-modification-return>
        </ng-container>

        <ng-container *ngIf="!isEditMode">
            <ng-container *ngIf="auditNotes && auditNotes.length > 0">
                <ul class="mt-4">
                    <ng-container *ngFor="let AuditNote of auditNotes">
                        <li class="flex-between">
                            <div class="flex-y-row gap-1">
                                <img src="assets/images/icons/lawsuit-details/document-text.svg" width="18" alt="document-text">
                                <p class="fw-5 small op-7"> {{ AuditNote.Subject }} </p>
                            </div>

                            <div class="flex-y-row gap-1">
                                <img src="assets/images/icons/calendar-2.svg" width="18" alt="calendar">
                                <p class="fw-5 small op-7">{{AuditNote.createdOn | date: 'dd/MM/yyy'}}</p>
                            </div>
                        </li>
                    </ng-container>
                </ul>
            </ng-container>
        </ng-container>
    </details>
</div>
