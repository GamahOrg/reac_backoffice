<div class="grid-3 mt-5">

    <div *ngIf="reviwerNotes?.length !== 0">
        <div *ngFor="let review of reviwerNotes ; index as i">
        
            <h6 class="small fw-5 mt-5"> {{ translations.lawsuits.createEditLawsuit.reviwerNotes | translate }} <span> {{ review?.employee?.employeeName}}</span> </h6>
            <div class="flex-y-row gap-2 mt-5">
                <img src="assets/images/icons/lawsuit-details/user.svg" alt="icon">
                <h6 class="small op-7">
                    {{review?.notes || '--'}}
                </h6>
            </div>
            
            <h6 class="small fw-5 mt-5"> {{ translations.lawsuits.createEditLawsuit.notesCreatedDate | translate }} </h6>

                <div class="small op-7 mt-5" >
                    {{review?.createdOn | date}}
                </div>

            

            <label class="mt-5 mb-2 small fw-6">{{translations.lawsuits.lawsuitDetails.lawsuitAttachements | translate}}</label>
        <div class="flex-between p-2 rounded-2 w-lg-5" style="background: #F7F7F7;" *ngFor="let file of review?.workFlowProcessingLogFiles">
            <div class="flex-y-row gap-2">
                <img src="assets/images/icons/lawsuit-details/attachment.svg" alt="attachment">
                <p class="v-small fw-6 op-9">{{file.fileManager.fileDescription}}</p>
            </div>
            <div class="flex-y-row gap-1">
                <a [href]="baseUrl + file.fileManager.filePath" target="_blank">
                    <i class='btn px-0 material-icons op-3 fs-5'>visibility</i>
                </a>
                <a [href]="baseUrl + file.fileManager.filePath" target="_blank" download>
                </a>
            </div>
        </div>

        <div>
            <hr class="solid">
        </div>
    </div>
    </div>
    

    
    
    
</div>
