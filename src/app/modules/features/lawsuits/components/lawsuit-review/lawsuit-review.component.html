<div>

  <label class="required mb-2 mt-6" >{{translations.lawsuits.lawsuitDetails.selectReviewResult | translate}}</label>
  <div class="grid-4"  *ngIf="buttonActions && buttonActions.workFlowStepEventShortDtos.length>0">
    <label class="rounded-2 border p-4"
           *ngFor="let button of buttonActions.workFlowStepEventShortDtos"
           [ngClass]="{'active': actionData && actionData.id === button.id}">
      <input type="radio"
             name="reason"
             (change)="updateActionData(button)"
             [checked]="actionData && actionData.id === button.id"
             [value]="button.id">
             
      <span>
        {{button.eventName}}

        <div *ngIf="buttonActions.fees != null">
          {{buttonActions.fees }} ريال 
        </div>

      </span>
    </label>

    <label class="required mt-4 small fw-6"
           *ngIf="actionData?.allowNotes">{{translations.lawsuits.lawsuitDetails.notes | translate}}</label>
    <div class="form-control d-flex flex-column mt-2"
         *ngIf="actionData?.allowNotes">
      <textarea id="notes-description"
                name="notes"
                [maxlength]="1000"
                class="form-control border-0 shadow-none"
                style="outline: 0;"
                rows="5"
                placeholder="{{translations.lawsuits.lawsuitDetails.writeDetailedRequestedModification | translate}}"
                (input)="updateCharCount($event, 'notes')"
                [(ngModel)]="notes"></textarea>
      <span class="op-7 w-fit flex-end">{{ charCounts['notes'] }}/{{1000}}</span>
    </div>
    <div *ngIf="isReviewSubmitted && actionData?.allowNotes && notes.length === 0"
    class="invalid-feedback d-block">
          {{translations.formValidationError.required | translate}}
    </div>
    <div class="w-lg-7"
         *ngIf="actionData?.allowFileUpload">
      <label class="mt-4 small fw-6">{{translations.lawsuits.lawsuitDetails.addAttachments | translate}}</label>
      <app-file-uploader [data]="multiFileUploaderData"
                         (fileUploaded)="onFilesUploaded($event)"></app-file-uploader>
    </div>
  </ng-container>
