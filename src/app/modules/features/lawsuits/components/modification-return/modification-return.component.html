<label class="mt-4 small fw-6">{{translations.lawsuits.lawsuitDetails.subject | translate}}</label>
<div class="form-control d-flex flex-column mt-2">
    <textarea
        id="subject-description"
        name="subject"
        [maxlength]="100"
        class="form-control border-0 shadow-none"
        style="outline: 0;"
        rows="1"
        placeholder="{{translations.lawsuits.lawsuitDetails.enterPurposeOfRequestedModification | translate}}"
        (input)="updateCharCount($event, 'subject')"
        [(ngModel)]="subject"></textarea>
    <span class="op-7 w-fit flex-end">{{ charCounts['subject'] }}/{{100}}</span>
</div>

<label class="required mt-4 small fw-6">{{translations.lawsuits.lawsuitDetails.notes | translate}}</label>
<div class="form-control d-flex flex-column mt-2">
    <textarea
        id="notes-description"
        name="notes"
        [maxlength]="1000"
        class="form-control border-0 shadow-none"
        style="outline: 0;"
        rows="5"
        placeholder="{{translations.lawsuits.lawsuitDetails.writeDetailedRequestedModification | translate}}"
        (input)="updateCharCount($event, 'notes')"
        [(ngModel)]="notes"></textarea>
    <span class="op-7 w-fit flex-end">{{ charCounts['notes'] }}/{{1000}}</span>
</div>

<div class="w-lg-7">
    <label class="mt-4 small fw-6">{{translations.lawsuits.lawsuitDetails.addAttachments | translate}}</label>
    <app-file-uploader></app-file-uploader>
</div>
