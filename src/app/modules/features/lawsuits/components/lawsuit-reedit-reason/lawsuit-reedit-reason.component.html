<ng-container *ngIf="auditNotes && auditNotes.length > 0">
    <article class="accordion-card" *ngFor="let note of auditNotes">
        <header class="flex-between border-bottom pb-5">
            <div class="flex-y-row gap-2">
                <img src="assets/images/icons/bookmarks.svg" alt="bookmarks">
                <h6 class="small fw-6 f-18"> {{ translations.lawsuits.lawsuitDetails.LawsuitEditReasons | translate }} </h6>
            </div>

            <div class="fw-6 op-7">{{note.createdOn | date: 'dd/MM/yyy'}}</div>
        </header>

        <label class="mt-5 mb-2 small fw-6" *ngIf="note.Subject">{{translations.lawsuits.lawsuitDetails.lawsuitSubject | translate}}</label>
        <p class="px-4 py-8 rounded-2 small" style="background: var(--beige2);" *ngIf="note.Subject">
            {{ note.Subject }}
        </p>

        <label class="mt-5 mb-2 small fw-6">{{translations.lawsuits.lawsuitDetails.lawsuitNotes | translate}}</label>
        <p class="px-4 py-8 rounded-2 small" style="background: var(--beige2);">
            {{ note.notes }}
        </p>

        <label class="mt-5 mb-2 small fw-6">{{translations.lawsuits.lawsuitDetails.lawsuitAttachements | translate}}</label>
        <div class="flex-between p-2 rounded-2 w-lg-5" style="background: #F7F7F7;" *ngFor="let file of note.workFlowProcessingLogFiles">
            <div class="flex-y-row gap-2">
                <img src="assets/images/icons/lawsuit-details/attachment.svg" alt="attachment">
                <p class="v-small fw-6 op-9">{{file.fileManager.fileDescription}}</p>
            </div>
            <div class="flex-y-row gap-1">
                <a [href]="baseUrl + file.fileManager.filePath" target="_blank">
                    <i class='btn px-0 material-icons op-3 fs-5'>visibility</i>
                </a>
                <a [href]="baseUrl + file.fileManager.filePath" target="_blank" download>
                    <i class='btn px-0 material-icons op-3 fs-5'>download</i>
                </a>
            </div>
        </div>
    </article>
</ng-container>
