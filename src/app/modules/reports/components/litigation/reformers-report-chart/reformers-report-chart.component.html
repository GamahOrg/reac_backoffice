<div class="chart-container" id="pdfContent" #pdfContent>
  <h4>لوحة إحصائيات المصلحين</h4>

  <!-- Chart Type Selector -->
  <div class="row row-gap-4">
    <div class="col-xl-3">
      <label for="chartType" class="form-label">نوع الرسم البياني:</label>
      <select class="form-select" id="chartType" [(ngModel)]="selectedChartType" (change)="updateChart()">
        <option value="bar">رسم بياني عمودي</option>
        <option value="pie">رسم دائري</option>
        <option value="doughnut">رسم دائري مجوف</option>
        <option value="radar">رسم شبكي</option>
      </select>
    </div>

    <div class="col-xl-3">
      <label for="dataView" class="form-label">عرض البيانات:</label>
      <select class="form-select" id="dataView" [(ngModel)]="selectedDataView" (change)="updateChart()">
        <option value="litigation">عدد الدعاوى</option>
        <option value="ratios">نسب الإنجاز</option>
        <option value="experience">الخبرة مقابل إجمالي القضايا</option>
      </select>
    </div>

    <div class="col-xl-3">
      <div class="d-flex align-items-end h-100">
        <button id="downloadPDFBtn" class="btn btn-primary" (click)="downloadPDF()">تحميل PDF</button>
      </div>
    </div>
  </div>

  <!-- Chart Canvas -->
  <div class="chart-wrapper">
    <canvas #chartCanvas></canvas>
  </div>

  <!-- Data Summary -->
  <div class="data-summary">
    <div class="row row-gap-4">
      <div class="col-xl">
        <div class="chart-section">
          <h4>إجمالي المصلحين</h4>
          <p>{{inputData.length}}</p>
        </div>
      </div>

      <div class="col-xl">
        <div class="chart-section">
          <h4>إجمالي القضايا</h4>
          <p>{{getTotalCases()}}</p>
        </div>
      </div>

      <div class="col-xl">
        <div class="chart-section">
          <h4>متوسط معدل الإنجاز</h4>
          <p>{{getAverageCompletionRate()}}%</p>
        </div>
      </div>
    </div>
  </div>
</div>
