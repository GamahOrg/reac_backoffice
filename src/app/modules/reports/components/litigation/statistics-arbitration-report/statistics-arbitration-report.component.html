<app-breadcrumbs></app-breadcrumbs>


<app-filter (filterChange)="onFilterChange($event)" [visibleFilters]="filterVisibility"></app-filter>

<div class="row">
  <div class="col-md-6">
    <div class="form-wrapper"> (حسب الحاله)</div>
    <div class="w-100">
      <canvas baseChart [data]="statusPieChartData" [labels]="statusPieChartData.labels" [options]="chartOptions" [type]="pieChartType" [legend]="chartLegend"></canvas>
    </div>
  </div>

  <div class="col-md-6">
    <div class="form-wrapper"> (حسب النوع)</div>
    <div class="w-100">
      <canvas baseChart [data]="typePieChartData" [labels]="typePieChartData.labels" [options]="chartOptions" [type]="pieChartType" [legend]="chartLegend"></canvas>
    </div>
  </div>
</div>

<app-statistics-arbitration [reportData]="this.LitigationStatisticsData?.[0]"></app-statistics-arbitration>
