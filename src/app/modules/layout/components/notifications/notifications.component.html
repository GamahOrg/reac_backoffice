<div class="notifications-dropdown" ngbDropdown>
  <span class="no-caret cursor-pointer" id="dropdownNotifications" ngbDropdownToggle>
    <span class="count flex-center">{{notViewedCount > 9 ? '9+' : notViewedCount}}</span>
    <span class="icon">
      <i class="hgi hgi-stroke hgi-notification-03"></i>
    </span>
  </span>

  <div ngbDropdownMenu aria-labelledby="dropdownNotifications" [class.py-4]="notificationList && notificationList.length === 0">
    @if (notificationList && notificationList.length > 0) {
    @for (notification of notificationList; track $index) {
    <button ngbDropdownItem [ngClass]="{'read': !notification.isViewed}">
      <a class="notification-link" (click)="onNotificationClicked(notification)">
        {{ notification.message }}
      </a>
    </button>
    }

    <app-pagination class="mt-5"></app-pagination>

    }

    @if (notificationList && notificationList.length === 0) {
    <span class="notification-item p-4 text-center">
      لا يوجد إشعارات
    </span>
    }
  </div>
</div>
