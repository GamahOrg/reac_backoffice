<footer class="main-footer flex-between flex-row gap-0">
	<button class="btn small fw-6 border"
					(click)="back()"
					*ngIf="previousBtnIsVisible">{{translations.actions.goBack| translate}}</button>

	<div class="flex-y-row gap-0 ms-auto">
		<button class="btn small fw-6 text-primary"
						*ngIf="saveAsDraftBtnIsVisible"
						(click)="saveAsDraft()">{{translations.actions.saveAsDraft| translate}}</button>

		<button class="btn small fw-6 btn-primary"
						(click)="next()"
						*ngIf="nextBtnIsVisible">{{translations.actions.next| translate}}</button>
	</div>
</footer>
