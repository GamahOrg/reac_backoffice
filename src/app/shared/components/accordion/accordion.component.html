@for (item of _accordionService.accordionContent().accordionComponentList; track $index) {
    @if (item.isVisible) {
        <div class="accordion-card">
            <details open>                
                <summary class="flex-y-row gap-2 border-bottom pb-5">
                    <img [src]="item.icon" alt="bookmarks">
                    <h6 class="small fw-6 op-7">{{item.title | translate}}</h6>
                </summary>

                @if (item.component && item.isRendered) {
                    <ng-container *ngComponentOutlet="item.component"></ng-container>
                }                
            </details>
        </div> 
    }
}
