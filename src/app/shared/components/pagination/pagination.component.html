<ngb-pagination [collectionSize]="pagintationData.totalCount"
                [(page)]="currentPage"
                [maxSize]="pagintationData.pageSize"
                (pageChange)="pageChanged($event)"
                [pageSize]="pagintationData.pageSize"
                [boundaryLinks]="false"
                (click)="clickOnPagination($event)"
                [rotate]="false"
                [ellipses]="false">
  <ng-template ngbPaginationPrevious>{{translations.actions.previous| translate}}</ng-template>
  <ng-template ngbPaginationNext>{{translations.actions.next | translate}}</ng-template>
</ngb-pagination>
