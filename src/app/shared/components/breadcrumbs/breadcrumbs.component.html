<nav aria-label="breadcrumb" *ngIf="breadcrumbList.length>0">
  <ol class="breadcrumb">
    <ng-container *ngFor="let item of breadcrumbList; index as i; trackBy: trackByFn; let isLast = last">
      <li class="breadcrumb-item" *ngIf="!isLast">
        <a *ngIf="item.link !== 'back'" [routerLink]="item.link">{{item.label | translate}}</a>
        <a *ngIf="item.link === 'back'" href="#" (click)="onBreadcrumbClick($event, item)">{{item.label | translate}}</a>
      </li>
      <li class="breadcrumb-item" aria-current="page" *ngIf="isLast">{{item.label | translate}}</li>
    </ng-container>
  </ol>
</nav>
